name: Deploy to GitHub Pages

# On every push to main: lint, run the content and chat tests, then rebuild the
# site and publish it to the gh-pages branch. If a test fails, nothing is deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx oxlint src api scripts
      - name: Content and chat tests
        run: npm test
      - run: npx vite build --base /portfolio/
      - run: touch dist/.nojekyll
      - name: Publish dist to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
